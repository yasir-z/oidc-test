name: Test AWS OIDC Authentication

on:
  workflow_dispatch: # Isko manually GitHub UI se run kar sakte hain

permissions:
  id-token: write
  contents: read

jobs:
  assume-role:
    runs-on: ubuntu-latest
    steps:
      - name: Git Clone
        uses: actions/checkout@v4
        
      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@v1
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::800770414493:role/gh-role"
          aws-region: us-east-1

      - name: Verify AWS Access (Check Caller Identity)
        run: |
          aws sts get-caller-identity
